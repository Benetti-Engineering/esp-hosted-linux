<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="766" viewBox="0 0 1040 766" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi 5 RP1 QSPI to ESP32-C5 SPI-HD wiring</title>
  <desc id="desc">SCLK BCM11 physical pin 23 to ESP GPIO27; CS BCM8 pin24 to GPIO4; SIO0 BCM10 pin19 to GPIO1; SIO1 BCM9 pin21 to GPIO6; SIO2 BCM1 pin28 to GPIO26; SIO3 BCM0 pin27 to GPIO23; Data Ready BCM12 pin32 to GPIO2; ESP reset BCM6 pin31 to EN/RST; common ground pin39. SPI mode 3, 3.3V logic. Four SIO signals are bidirectional; no classic SPI Handshake line.</desc>
  <style>
    .heading { font: 700 25px sans-serif; fill: #0f172a; }
    .sub { font: 15px sans-serif; fill: #475569; }
    .colheading { font: 700 17px sans-serif; fill: #0f172a; }
    .signal { font: 700 16px sans-serif; fill: #1e293b; }
    .pin { font: 600 17px sans-serif; fill: #1e293b; }
    .direction { font: 12px sans-serif; fill: #475569; }
    .foot { font: 14px sans-serif; fill: #475569; }
  </style>
  <rect width="1040" height="766" rx="18" fill="#f8fafc"/>
  <rect x="14" y="14" width="1012" height="738" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="54" class="heading">ESP-Hosted SPI-HD / QSPI reference wiring</text>
  <text x="36" y="82" class="sub">Raspberry Pi 5 RP1 SPI0 ↔ ESP32-C5 · 4-bit data, mode 3 · 3.3 V logic only</text>
  <rect x="29" y="105" width="410" height="42" rx="9" fill="#dbeafe"/>
  <rect x="594" y="105" width="420" height="42" rx="9" fill="#d1fae5"/>
  <text x="44" y="132" class="colheading">Raspberry Pi 5 · BCM GPIO / physical pin</text>
  <text x="607" y="132" class="colheading">ESP32-C5 · example firmware pins</text>

  <rect x="24" y="152" width="992" height="49" rx="8" fill="#ffffff"/>
  <text x="44" y="183" class="signal">SCLK</text>
  <text x="434" y="182" class="pin" text-anchor="end">BCM11 · pin 23</text>
  <path d="M 455 177 L 581 177" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="455" cy="177" r="5" fill="#1d4ed8"/>
  <circle cx="581" cy="177" r="5" fill="#1d4ed8"/>
  <text x="518" y="165" class="direction" text-anchor="middle">Pi → ESP</text>
  <text x="608" y="182" class="pin">GPIO27</text>
  <rect x="24" y="210" width="992" height="49" rx="8" fill="#f3f7fb"/>
  <text x="44" y="241" class="signal">CS0</text>
  <text x="434" y="240" class="pin" text-anchor="end">BCM8 · pin 24</text>
  <path d="M 455 235 L 581 235" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="455" cy="235" r="5" fill="#1d4ed8"/>
  <circle cx="581" cy="235" r="5" fill="#1d4ed8"/>
  <text x="518" y="223" class="direction" text-anchor="middle">Pi → ESP</text>
  <text x="608" y="240" class="pin">GPIO4</text>
  <rect x="24" y="268" width="992" height="49" rx="8" fill="#ffffff"/>
  <text x="44" y="299" class="signal">SIO0 / D0</text>
  <text x="434" y="298" class="pin" text-anchor="end">BCM10 · pin 19</text>
  <path d="M 455 293 L 581 293" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <circle cx="455" cy="293" r="5" fill="#059669"/>
  <circle cx="581" cy="293" r="5" fill="#059669"/>
  <text x="518" y="281" class="direction" text-anchor="middle">bidirectional</text>
  <text x="608" y="298" class="pin">GPIO1</text>
  <rect x="24" y="326" width="992" height="49" rx="8" fill="#f3f7fb"/>
  <text x="44" y="357" class="signal">SIO1 / D1</text>
  <text x="434" y="356" class="pin" text-anchor="end">BCM9 · pin 21</text>
  <path d="M 455 351 L 581 351" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <circle cx="455" cy="351" r="5" fill="#059669"/>
  <circle cx="581" cy="351" r="5" fill="#059669"/>
  <text x="518" y="339" class="direction" text-anchor="middle">bidirectional</text>
  <text x="608" y="356" class="pin">GPIO6</text>
  <rect x="24" y="384" width="992" height="49" rx="8" fill="#ffffff"/>
  <text x="44" y="415" class="signal">SIO2 / D2</text>
  <text x="434" y="414" class="pin" text-anchor="end">BCM1 · pin 28</text>
  <path d="M 455 409 L 581 409" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <circle cx="455" cy="409" r="5" fill="#059669"/>
  <circle cx="581" cy="409" r="5" fill="#059669"/>
  <text x="518" y="397" class="direction" text-anchor="middle">bidirectional</text>
  <text x="608" y="414" class="pin">GPIO26</text>
  <rect x="24" y="442" width="992" height="49" rx="8" fill="#f3f7fb"/>
  <text x="44" y="473" class="signal">SIO3 / D3</text>
  <text x="434" y="472" class="pin" text-anchor="end">BCM0 · pin 27</text>
  <path d="M 455 467 L 581 467" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <circle cx="455" cy="467" r="5" fill="#059669"/>
  <circle cx="581" cy="467" r="5" fill="#059669"/>
  <text x="518" y="455" class="direction" text-anchor="middle">bidirectional</text>
  <text x="608" y="472" class="pin">GPIO23</text>
  <rect x="24" y="500" width="992" height="49" rx="8" fill="#ffffff"/>
  <text x="44" y="531" class="signal">Data Ready</text>
  <text x="434" y="530" class="pin" text-anchor="end">BCM12 · pin 32</text>
  <path d="M 455 525 L 581 525" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <circle cx="455" cy="525" r="5" fill="#b45309"/>
  <circle cx="581" cy="525" r="5" fill="#b45309"/>
  <text x="518" y="513" class="direction" text-anchor="middle">ESP → Pi</text>
  <text x="608" y="530" class="pin">GPIO2</text>
  <rect x="24" y="558" width="992" height="49" rx="8" fill="#f3f7fb"/>
  <text x="44" y="589" class="signal">ESP reset / EN</text>
  <text x="434" y="588" class="pin" text-anchor="end">BCM6 · pin 31</text>
  <path d="M 455 583 L 581 583" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <circle cx="455" cy="583" r="5" fill="#b45309"/>
  <circle cx="581" cy="583" r="5" fill="#b45309"/>
  <text x="518" y="571" class="direction" text-anchor="middle">Pi → ESP</text>
  <text x="608" y="588" class="pin">EN / RST</text>
  <rect x="24" y="616" width="992" height="49" rx="8" fill="#ffffff"/>
  <text x="44" y="647" class="signal">GND</text>
  <text x="434" y="646" class="pin" text-anchor="end">pin 39 · GND</text>
  <path d="M 455 641 L 581 641" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="455" cy="641" r="5" fill="#64748b"/>
  <circle cx="581" cy="641" r="5" fill="#64748b"/>
  <text x="518" y="629" class="direction" text-anchor="middle">common ground</text>
  <text x="608" y="646" class="pin">GND</text>
  <path d="M 35 708 H 1004" stroke="#cbd5e1"/>
  <text x="42" y="732" class="foot">SIO0–SIO3 are bidirectional; Data Ready runs ESP → Pi. No legacy SPI Handshake pin.</text>
</svg>
