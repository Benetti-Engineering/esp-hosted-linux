# Fast preflight: repository hygiene, syntax, version and approval policy.

firmware-version:
  stage: preflight
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  script:
    - .gitlab/ci/scripts/auto-bump-version.sh
  rules:
    # The bot can only safely push to a branch in this same project.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      changes:
        - esp/esp_driver/network_adapter/**/*
        - host/include/esp_fw_version.h
    - when: never

# Docker image provenance is validated by each consuming build/test job.

mirrored-headers:
  stage: preflight
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  script:
    - .gitlab/ci/scripts/check-mirrored-files.sh
  rules:
    - when: always

ci-syntax:
  stage: preflight
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  script:
    - |
      set -e
      while IFS= read -r -d '' script; do
        if ! bash -n "$script"; then
          echo "ERROR: Bash syntax: $script" >&2
          exit 1
        fi
      done < <(find .gitlab/ci -type f -name '*.sh' -print0)
    - python3 -m py_compile .gitlab/ci/scripts/version_header.py
    - python3 -m py_compile .gitlab/ci/software/*.py tests/software/*.py
  rules:
    - changes:
        - .gitlab-ci.yml
        - .gitlab/ci/**/*
        - tests/software/**/*
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Mandatory changed-file hooks use the pinned ESP CI image with job-local dependencies.
pre-commit:
  stage: preflight
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  variables:
    GIT_DEPTH: "0"
  before_script:
    - python3 -m venv .venv-precommit
    - . .venv-precommit/bin/activate
    - python3 -m pip install --disable-pip-version-check --no-input pre-commit==4.6.2
  script:
    - bash .gitlab/ci/scripts/run-precommit.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

wifi-lib-integrity:
  stage: preflight
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  script:
    - .gitlab/ci/scripts/check-wifi-lib-md5.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - esp/esp_driver/lib/**/*
        - esp/esp_driver/network_adapter/main/esp_wifi_driver.h
        - .gitlab/ci/scripts/check-wifi-lib-md5.sh
        - .gitlab/ci/**/*
        - .gitlab-ci.yml
    - when: never

# Mandatory documentation gate on doc-bearing changes, independently of toolbox.
docs-check:
  stage: preflight
  image: "$ESP_CI_IMAGE"
  tags:
    - build
  before_script:
    - python3 -m venv .venv-docs
    - . .venv-docs/bin/activate
    - python3 -m pip install --disable-pip-version-check --no-input -r .gitlab/ci/docs-requirements.txt
  script:
    - python3 tools/check_docs.py
    - mkdocs build --strict --site-dir /tmp/esp-hosted-docs-html
  rules:
    # Run only on documentation changes.
    # Keep baseline repository documentation checks on actual docs changes.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null)'
      changes:
        - README.md
        - CONTRIBUTING.md
        - ORIGIN.md
        - docs/**/*
        - docs-theme/**/*
        - mkdocs.yml
        - tools/check_docs.py
        - .gitlab/ci/docs-requirements.txt
    - when: never
