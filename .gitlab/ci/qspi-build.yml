# SPI-HD / QSPI firmware compile matrix for every *capable* Wi-Fi chip.
# Hardware/throughput qualification remains in ESP-HIL, not this pipeline.
# The original ESP32 has no SOC_SPI_SUPPORT_SLAVE_HD_VER2 and is excluded.
qspi:firmware:all:
  extends: .firmware_build
  parallel:
    matrix:
      - IDF_TARGET: ["esp32s2", "esp32s3", "esp32c2", "esp32c3", "esp32c5", "esp32c6", "esp32c61", "esp32s31"]
        TRANSPORT: ["spi_hd"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - esp/esp_driver/network_adapter/**/*
        - esp/esp_driver/setup.sh
        - .gitlab/ci/firmware-build.yml
        - .gitlab/ci/qspi-build.yml
        - .gitlab/ci/scripts/build-firmware.sh
        - .gitlab-ci.yml

# SPI-HD *host* builds reuse the existing 4.9...7.2 Linux matrix in
# linux.yml; linux-build.sh builds spi_hd beside sdio, spi and usb.
# This avoids duplicating eleven host jobs just for a fourth module.
# RP1 DesignWare kernel patch builds / live hardware remain separate
# from generic host module kernel compatibility.
